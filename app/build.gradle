apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Phien ban lay tu file VERSION o goc repo (workflow Build APK tu tang sau moi lan cap nhat). Hong/thieu file -> 1.0.
def starVersion = "1.0"
try {
    def vf = file("../VERSION")
    if (vf.exists() && vf.text.trim() ==~ /\d+\.\d+/) starVersion = vf.text.trim()
} catch (Exception ignored) { }
def starParts = starVersion.tokenize(".")

// Ky APK: CHI dung keystore RIENG (CI giai ma tu GitHub Secrets thanh file roi dat STARHUB_KEYSTORE_FILE + STARHUB_KEYSTORE_PASSWORD;
// xem README muc "Ky APK"). Thieu thi build BAO LOI, khong ky bang khoa cong khai.
def starKeystorePath = System.getenv("STARHUB_KEYSTORE_FILE")
def starKeystorePassword = System.getenv("STARHUB_KEYSTORE_PASSWORD")
if (starKeystorePath == null || starKeystorePath.isEmpty() || !file(starKeystorePath).exists()) {
    throw new GradleException("Thieu keystore rieng: dat STARHUB_KEYSTORE_FILE (duong dan file .jks) va STARHUB_KEYSTORE_PASSWORD. Xem README muc 'Ky APK'.")
}
if (starKeystorePassword == null || starKeystorePassword.isEmpty()) {
    throw new GradleException("Co STARHUB_KEYSTORE_FILE nhung thieu STARHUB_KEYSTORE_PASSWORD")
}

android {
    namespace 'com.starclan.starhub'
    compileSdk 34

    defaultConfig {
        applicationId "com.starclan.starhub"
        minSdk 26
        targetSdk 34
        versionCode starParts[0].toInteger() * 10000 + starParts[1].toInteger()
        versionName starVersion
    }

    signingConfigs {
        starhub {
            storeFile file(starKeystorePath)
            storePassword starKeystorePassword
            keyAlias System.getenv("STARHUB_KEY_ALIAS") ?: "starhub"
            keyPassword System.getenv("STARHUB_KEY_PASSWORD") ?: starKeystorePassword
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.starhub
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Ma hoa token API (EncryptedSharedPreferences, khoa trong Android Keystore)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    // Coroutine - de farm / gui lenh co the "doi" ma khong lam dung giao dien
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Gson - doc JSON ma owo-tracker tra ve (GET /hub, /gemtier, ...)
    implementation "com.google.code.gson:gson:2.11.0"

    // Test chay tren JVM (khong can may that): gradle testDebugUnitTest
    testImplementation "junit:junit:4.13.2"
}
