apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Phien ban lay tu file VERSION o goc repo (workflow Build APK tu tang sau moi lan cap nhat). Hong/thieu file -> 1.0.
def starVersion = "1.0"
try {
    def vf = file("../VERSION")
    if (vf.exists() && vf.text.trim() ==~ /\d+\.\d+/) starVersion = vf.text.trim()
} catch (Exception ignored) { }
def starParts = starVersion.tokenize(".")

// Ky APK: uu tien keystore RIENG (CI giai ma tu GitHub Secrets thanh file roi dat STARHUB_KEYSTORE_FILE + STARHUB_KEYSTORE_PASSWORD;
// xem README muc "Ky APK"). Khong co thi dung tam keystore/debug.keystore cong khai de van build duoc.
def starKeystorePath = System.getenv("STARHUB_KEYSTORE_FILE")
def starKeystorePassword = System.getenv("STARHUB_KEYSTORE_PASSWORD")
def useOwnKeystore = starKeystorePath != null && !starKeystorePath.isEmpty() && file(starKeystorePath).exists()
if (useOwnKeystore && (starKeystorePassword == null || starKeystorePassword.isEmpty())) {
    throw new GradleException("Co keystore rieng (STARHUB_KEYSTORE_FILE) nhung thieu STARHUB_KEYSTORE_PASSWORD")
}
if (!useOwnKeystore) {
    logger.warn("CANH BAO: chua co keystore rieng - APK dang ky bang keystore/debug.keystore CONG KHAI trong repo.")
}

android {
    namespace 'com.starclan.starhub'
    compileSdk 34

    defaultConfig {
        applicationId "com.starclan.starhub"
        minSdk 26
        targetSdk 34
        versionCode starParts[0].toInteger() * 10000 + starParts[1].toInteger()
        versionName starVersion
    }

    signingConfigs {
        starhub {
            if (useOwnKeystore) {
                storeFile file(starKeystorePath)
                storePassword starKeystorePassword
                keyAlias System.getenv("STARHUB_KEY_ALIAS") ?: "starhub"
                keyPassword System.getenv("STARHUB_KEY_PASSWORD") ?: starKeystorePassword
            } else {
                // DU PHONG khi chua cai keystore rieng: keystore debug CONG KHAI trong repo (xem README muc "Ky APK")
                storeFile file("../keystore/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.starhub
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Ma hoa token API (EncryptedSharedPreferences, khoa trong Android Keystore)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    // Coroutine - de farm / gui lenh co the "doi" ma khong lam dung giao dien
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Gson - doc JSON ma owo-tracker tra ve (GET /hub, /gemtier, ...)
    implementation "com.google.code.gson:gson:2.11.0"

    // Test chay tren JVM (khong can may that): gradle testDebugUnitTest
    testImplementation "junit:junit:4.13.2"
}
