apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Phien ban lay tu file VERSION o goc repo (workflow Build APK tu tang sau moi lan cap nhat). Hong/thieu file -> 1.0.
def starVersion = "1.0"
try {
    def vf = file("../VERSION")
    if (vf.exists() && vf.text.trim() ==~ /\d+\.\d+/) starVersion = vf.text.trim()
} catch (Exception ignored) { }
def starParts = starVersion.tokenize(".")

android {
    namespace 'com.starclan.starhub'
    compileSdk 34

    defaultConfig {
        applicationId "com.starclan.starhub"
        minSdk 26
        targetSdk 34
        versionCode starParts[0].toInteger() * 10000 + starParts[1].toInteger()
        versionName starVersion
    }

    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"

    // Ma hoa token API (EncryptedSharedPreferences, khoa trong Android Keystore)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"

    // Coroutine - de farm / gui lenh co the "doi" ma khong lam dung giao dien
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Gson - doc JSON ma owo-tracker tra ve (GET /hub, /gemtier, ...)
    implementation "com.google.code.gson:gson:2.11.0"

    // Test chay tren JVM (khong can may that): gradle testDebugUnitTest
    testImplementation "junit:junit:4.13.2"
}
