name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mat khau keystore RIENG (GitHub Secrets). Rong thi build.gradle tu dung keystore debug du phong.
      STARHUB_KEYSTORE_PASSWORD: ${{ secrets.STARHUB_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tang so phien ban TRUOC khi build de APK mang dung so moi (1.4 -> 1.5). Chi khi push len main,
      # va bo qua chinh commit tang version. Chay tay (workflow_dispatch) thi giu nguyen so.
      - name: Tang so phien ban
        id: bump
        if: github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(version)')
        run: |
          set -euo pipefail
          cur=$(tr -d '[:space:]' < VERSION 2>/dev/null || true)
          if ! echo "$cur" | grep -Eq '^[0-9]+\.[0-9]+$'; then cur="1.0"; fi
          new="${cur%%.*}.$(( ${cur##*.} + 1 ))"
          echo "$new" > VERSION
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "Phien ban moi: $new"

      # Giai ma keystore rieng tu secret STARHUB_KEYSTORE_BASE64 (file .jks ma hoa base64 1 dong). Chua co secret thi chi canh bao.
      - name: Chuan bi keystore rieng
        env:
          KS_B64: ${{ secrets.STARHUB_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KS_B64:-}" ] && [ -n "${STARHUB_KEYSTORE_PASSWORD:-}" ]; then
            # Bo khoang trang / xuong dong / dau nhay thua (hay dinh khi dan secret) truoc khi giai ma
          if ! printf '%s' "$KS_B64" | tr -d ' \r\n\t"' | base64 -d > "$RUNNER_TEMP/starhub.jks"; then
            echo "::error title=Secret STARHUB_KEYSTORE_BASE64 sai::Noi dung khong phai base64 hop le (dan thieu / thua ky tu?). Dan lai TOAN BO noi dung file starhub.b64."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/starhub.jks" -storepass "$STARHUB_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error title=Keystore khong mo duoc::Giai ma xong nhung mo khong ra: sai STARHUB_KEYSTORE_PASSWORD hoac secret BASE64 bi cat / sai."
            exit 1
          fi
            echo "STARHUB_KEYSTORE_FILE=$RUNNER_TEMP/starhub.jks" >> "$GITHUB_ENV"
            echo "Dung keystore RIENG de ky APK"
          else
            echo "::warning title=Chua co keystore rieng::Thieu secret STARHUB_KEYSTORE_BASE64 / STARHUB_KEYSTORE_PASSWORD - APK dang ky bang keystore debug CONG KHAI. Xem README muc Ky APK."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: starhub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Chay SAU khi da upload APK de luon lay duoc APK; test hong thi workflow van bao do.
      - name: Unit test (JVM)
        run: gradle testDebugUnitTest --no-daemon

      # Chi commit lai VERSION khi build + test deu xanh. Commit do GITHUB_TOKEN tao ra khong kich hoat lai workflow.
      - name: Luu so phien ban moi len main
        if: success() && steps.bump.outputs.version != ''
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore(version): v${{ steps.bump.outputs.version }}"
          git fetch origin main
          git rebase origin/main || { echo "main co commit moi lam xung dot VERSION - bo qua lan nay"; git rebase --abort; exit 0; }
          git push origin HEAD:main
