name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: starhub-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Chay SAU khi da upload APK va chua chan build: test nay moi viet, chua tung chay tren may that.
      # Khi thay xanh on dinh thi xoa dong continue-on-error de test hong se chan build.
      - name: Unit test (JVM)
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon
